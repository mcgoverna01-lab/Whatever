services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pitch_draft
      POSTGRES_USER: pitch
      POSTGRES_PASSWORD: pitch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitch -d pitch_draft"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
